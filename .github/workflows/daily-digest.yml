name: sift

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Serialize manual runs so their commits do not race.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Web content fetching adds ~60-120 s of HTTP requests on incremental runs;
    # the first-ever run (fetching 50 articles) may need up to 20 min.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: qwen
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          # This workspace's dedicated MaaS endpoint. Workspace-scoped hosts
          # only accept keys issued to that same workspace, so the value is
          # deployment-specific. The path must be /compatible-mode/v1 — the
          # OpenAI-compatible one the SDK expects; the /api/v1 form the console
          # shows is the native DashScope API and 404s for an OpenAI client.
          DASHSCOPE_BASE_URL: https://ws-8vh9832rql2bepp1.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
          # Unused while LLM_PROVIDER is qwen — kept so switching is one line.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
          # Optional — no secret means the lenient offline mock runs instead.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: pnpm start

      - name: Commit digest files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            # CST date, matching the digests/YYYY-MM-DD/ folder produced by toCstDateStr
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            git commit -m "digest: ${DATE} daily digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        run: pnpm manifest

      - name: Commit manifest and feed
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Close stale issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm close-stale

